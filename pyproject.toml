[build-system]
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "sk-pqc"
dynamic = ["version"]
description = "Sovereign, app-agnostic hybrid post-quantum crypto primitives: hybrid X25519+ML-KEM-768 KEM (FIPS 203), PQXDH-style seal, metadata-sealing routing envelope, epoch ratchets, crypto-agility registry. Python sibling of the Dart sk_pqc."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "smilinTux / SKWorld" }]
keywords = [
    "post-quantum",
    "ML-KEM",
    "FIPS-203",
    "hybrid",
    "ratchet",
    "crypto-agility",
    "sovereign",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

# Core dependency: pyca/cryptography supplies the X25519 leg, HKDF combiner, and
# AES-256-GCM bulk cipher. The ML-KEM-768 leg needs liboqs (via the `oqs` import
# from `liboqs-python`) — installed via the `pq` extra below, since it pulls a
# native library. Without it the pure-pyca pieces (combiner, suite registry,
# anon-queue codec/MAC, key derivation) still work; hybrid KEM operations raise
# PqKemUnavailable (a hard error — never a silent classical downgrade).
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Enables the post-quantum (ML-KEM-768) leg. `liboqs-python` exposes the `oqs`
# import name and binds liboqs (FIPS 203).
pq = ["liboqs-python>=0.12"]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "liboqs-python>=0.12",
]
# HTML API-reference toolchain (pure-Python, no native compile). `make docs`.
docs = ["pdoc>=15"]

[project.urls]
Homepage = "https://github.com/smilinTux/sk-pqc-py"
"Dart sibling" = "https://github.com/smilinTux/sk-pqc-dart"
Standards = "https://github.com/smilinTux/sk-standards"

[tool.hatch.build.targets.wheel]
packages = ["src/sk_pqc"]

[tool.hatch.build.targets.sdist]
include = ["src/sk_pqc", "tests", "examples", "README.md", "LICENSE"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.version.raw-options]
# The git tag IS the version. A push to the default branch cuts the next
# patch tag (see .github/workflows/release.yml), so every release carries a
# genuinely new version instead of rebuilding 0.1.0 forever.
#
# These repos also carry NON-semver tags (swarm-20260717, fixwave-20260723,
# memory-index-fix-20260804, nextcloud-v0.3.0). setuptools-scm defaults to the
# newest tag of ANY shape, which derived a nonsense version like
# 20260805.dev25 for skcapstone. Both settings below restrict it to release
# tags only, matching the `--match 'v[0-9]*'` the tag job uses, so the two
# cannot disagree about which tag is current.
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
